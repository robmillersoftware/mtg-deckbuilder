  - The resulting deck is stored with correct card counts.
  priority: must_have
  status: ready
- id: 37e1856b-EP-6-US-49
  epic_id: 37e1856b-EP-6
  actor: Competitive player
  action: receive validation feedback for an imported deck
  benefit: so I can be confident the deck complies with Standard tournament rules
