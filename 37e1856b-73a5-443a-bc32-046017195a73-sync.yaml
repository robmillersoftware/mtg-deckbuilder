  - Private decks are inaccessible without the owner’s authentication
  - Changing visibility updates access rights immediately
  priority: should_have
  status: ready
- id: 37e1856b-EP-1-US-9
  epic_id: 37e1856b-EP-1
  actor: Authenticated user
  action: view their conversation history with the AI assistant
  benefit: review past advice, explanations, and deck iteration discussions without
