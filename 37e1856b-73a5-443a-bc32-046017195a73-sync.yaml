  acceptance_criteria:
  - The user can type a question that mentions a card present in the current deck.
  - The system returns a chat bubble that includes the card name, its role in the
    deck, and a concise explanation.
  - The explanation references the deck's archetype or strategy (e.g., "Lightning
    Strike provides efficient removal for 2-mana, 3-damage spells needed in a fast
    aggro curve").
