- id: d0e32035-777a-43b9-9e30-a5fdfad63f17
  title: "Wire up failure-after-retries alerts: when a job exhausts its retry attempts,\
    \ push a notification to the configured channel (Slack webhook or email) containing\
    \ job name, scheduled run time, error stack, and a link to the detailed log entry."
  story_id: 37e1856b-EP-7-US-58
  epic_id: null
  implementation_details: Create an alert service that follows the existing notification
    pattern (e.g., a `Notifier` interface). Hook it into the job-runner’s final-failure
    path. Build the message payload with required fields and send via the configured
    transport. Guard against duplicate alerts by only firing on the last attempt.
  story_points: 5
  depends_on:
  - 39de5d20-5237-4b0a-ade2-6b218a00606b
  - f4e09eec-976b-44db-a8b3-5cb88d2a126b
  - 8a32fb39-11d3-47d4-9995-cd04facf2d8a
- id: ede4e927-ff44-413e-8dc4-5195fba01dbc
  title: Expose a `/health/jobs` HTTP endpoint that returns JSON status for each scheduled
    job (last_success_timestamp, last_failure_timestamp, health flag, next_scheduled_run)
    and responds with 200 OK when all jobs are healthy or 503 Service Unavailable
    if any are unhealthy, guaranteeing sub-200 ms latency.
  story_id: 37e1856b-EP-7-US-59
  epic_id: null
  implementation_details: Add a FastAPI (or existing web framework) route under `/health/jobs`.
    Pull job metadata from the scheduler’s job store and the latest log entries. Compute
    health based on a configurable threshold (e.g., no failure in last 24 h). Use
    async DB calls and cache the result for a few seconds to meet latency. Return
    appropriate HTTP status codes.
  story_points: 5
  depends_on:
  - 39de5d20-5237-4b0a-ade2-6b218a00606b
  - f4e09eec-976b-44db-a8b3-5cb88d2a126b
- id: 0af3e3c6-3df6-402f-9941-32821d20297f
  title: "Build the operations dashboard: backend endpoints that aggregate recent\
    \ job run metrics (latest success timestamps, daily success/failure counts for\
    \ the past 30 days) and a front-end page showing those timestamps, a line chart\
    \ with failure highlights, drill-down links to logs, and auto-refresh within 5 minutes\
    \ of each job completion."
  story_id: 37e1856b-EP-7-US-60
  epic_id: null
  implementation_details: Create a metrics service that queries the centralized logs
    for run records, groups by job and date, and returns JSON suitable for charting.
    Add a new route `/admin/dashboard/jobs` returning this payload. On the UI side,
    add a React (or existing SPA) page that consumes the endpoint, renders a Chart.js
    (or similar) line chart, colors failure days red, and provides a modal with log
    details when a point is clicked. Use a short-interval polling or WebSocket to
    refresh data after job completion.
  story_points: 6
  depends_on:
  - ede4e927-ff44-413e-8dc4-5195fba01dbc
  - c1c14a6c-c092-44b4-a5f3-aaf409a9da45
- id: c1c14a6c-c092-44b4-a5f3-aaf409a9da45
  title: "Standardize execution logging: define a JSON schema for job run logs, integrate\
    \ all jobs (daily sync, weekly scrape, manual runs) with the central logging platform\
    \ (e.g., Loki or CloudWatch), ensure logs contain run ID, timestamps, duration,\
    \ record counts, and error/warning messages, and configure retention for at least\
    \ 90 days."
  story_id: 37e1856b-EP-7-US-61
  epic_id: null
  implementation_details: Create a logging helper that formats logs according to the
    schema and writes to the chosen backend via its SDK. Update the job-runner base
    class to emit a log entry at start, on each retry, and on completion/failure.
    Add index fields for job_name, run_id, status, and timestamps to enable efficient
    queries. Set up retention policies in the logging service configuration.
  story_points: 5
  depends_on: []
- id: a0eeba6e-c28a-43ab-994a-84033f7a2f7e
  title: Add an admin-only POST `/admin/jobs/{job_name}/run` endpoint that validates
    the `job_name` (scryfall_sync or mtgtop8_scrape), creates a new run ID, triggers
    the corresponding job immediately using the same processing, retry, logging and
    alerting pipeline, and returns the run ID with an initial `running` status.
  story_id: 37e1856b-EP-7-US-62
  epic_id: null
  implementation_details: Extend the API layer with a protected route guarded by role-based
    access control (admin role). Resolve the requested job name to the existing job
    implementation and invoke its `run_now` method. Reuse the retry wrapper from story
    57 and the logging/alerting hooks from stories 61 and 58. Return a JSON payload
    `{run_id, status}`. Ensure proper 403 handling for unauthorized callers.
  story_points: 6
  depends_on:
  - 39de5d20-5237-4b0a-ade2-6b218a00606b
  - f4e09eec-976b-44db-a8b3-5cb88d2a126b
  - 8a32fb39-11d3-47d4-9995-cd04facf2d8a
  - d0e32035-777a-43b9-9e30-a5fdfad63f17
  - c1c14a6c-c092-44b4-a5f3-aaf409a9da45
- id: 5ab14010-268e-4f8b-bf84-a5e145b9f4f6
  title: "Create the job-run history UI: backend endpoint that returns the last 50\
    \ executions per job with filtering (date range, status) and pagination, and a\
    \ front-end page that displays run ID, start/end times, status, and a link to\
    \ the detailed log, loading within 2 seconds and auto-refreshing after each new\
    \ run."
  story_id: 37e1856b-EP-7-US-63
  epic_id: null
  implementation_details: Add a `/admin/jobs/history` API that queries the centralized
    logs table, applies filters, orders by start time, and supports limit/offset pagination.
    Expose a lightweight DTO for the UI. On the client side, build a React component
    with a table, filter controls, and pagination UI. Use the log link to open a modal
    that fetches the full log entry from the logging service. Implement a short-interval
    poll or server-sent events to prepend new runs after they finish.
  story_points: 6
  depends_on:
  - c1c14a6c-c092-44b4-a5f3-aaf409a9da45
functional_requirements:
- id: FR-001
  category: User Management
  requirement: System shall allow new users to register with a valid email address
    and password, enforce password complexity rules, and send an email verification
    link.
  priority: Must Have
- id: FR-002
  category: User Management
  requirement: System shall authenticate users with email and password, issue a secure
    session token, and redirect authenticated users to their dashboard.
  priority: Must Have
- id: FR-003
  category: User Management
  requirement: System shall provide a password-reset workflow that sends a time-limited
    reset link to the verified email address and allows the user to set a new password.
  priority: Must Have
- id: FR-004
  category: User Management
  requirement: System shall enable authenticated users to view and edit their profile
    information, including display name, avatar image, and contact email.
  priority: Must Have
- id: FR-005
  category: User Management
  requirement: System shall allow a user to save a generated deck with a user-provided
    name and optional description, storing the main-deck, sideboard, and metadata
    in the user's account.
  priority: Must Have
- id: FR-006
  category: User Management
  requirement: System shall present a sortable list of a user's saved decks showing
    name, creation date, and privacy status, and allow the user to open any deck for
    viewing or editing.
  priority: Must Have
- id: FR-007
  category: User Management
  requirement: System shall permit a user to delete a saved deck after confirming
    the action, permanently removing it from the user's account.
  priority: Must Have
- id: FR-008
  category: User Management
  requirement: System shall let a user set a deck's visibility to Private or Public
    and, for public decks, generate a unique, non-guessable shareable URL that loads
    the deck in read-only mode.
  priority: Must Have
- id: FR-009
  category: User Management
  requirement: System shall store each conversation session (messages and current
    deck state) and allow an authenticated user to view a history of past sessions
    with timestamps and brief summaries.
  priority: Must Have
- id: FR-010
  category: User Management
  requirement: System shall provide a preferences page where a user can select default
    language, UI theme (light/dark), and default deck format (Standard), persisting
    the choices for future sessions.
  priority: Should Have
- id: FR-011
  category: Deck Builder Engine
  requirement: System shall accept a natural-language request describing desired archetype,
    colors, and strategy, and generate a complete Standard-legal 60-card main deck
    plus a 15-card sideboard.
  priority: Must Have
- id: FR-012
  category: Deck Builder Engine
  requirement: System shall provide slot-by-slot card recommendations, each accompanied
    by a concise explanation of why the card fits the requested role.
  priority: Must Have
- id: FR-013
  category: Deck Builder Engine
  requirement: System shall construct a sideboard of exactly 15 cards that addresses
    the top-5 archetypes in the current Standard meta, including a brief matchup rationale
    for each card.
  priority: Must Have
- id: FR-014
  category: Deck Builder Engine
  requirement: System shall answer on-demand questions about any card in the generated
    deck, providing a role-specific explanation, synergy notes, and alternative suggestions.
  priority: Must Have
- id: FR-015
  category: Deck Builder Engine
  requirement: System shall produce a matchup analysis section that lists each major
    archetype, its meta share, a qualitative rating (Favored/Even/Unfavored), and
    recommended sideboard adjustments.
  priority: Must Have
- id: FR-016
  category: Deck Builder Engine
  requirement: System shall accept a natural-language modification request for an
    existing deck, identify cards to replace, propose suitable alternatives respecting
    all constraints, and return the updated deck with explanations.
  priority: Must Have
- id: FR-017
  category: Deck Builder Engine
  requirement: System shall allow users to import an existing decklist (Arena, MTGO,
    or simple text), validate it against the Standard card pool, and present analysis
    and improvement suggestions.
  priority: Must Have
- id: FR-018
  category: Deck Builder Engine
  requirement: System shall enable users to export a deck in Arena format, MTGO format,
    or plain-text, and provide a one-click copy-to-clipboard or file-download action.
  priority: Must Have
- id: FR-019
  category: Deck Builder Engine
  requirement: System shall automatically validate every generated or imported deck
    for Standard legality, exact deck sizes (60 main, 15 sideboard), and the 4-copy
    limit, returning detailed error messages when violations occur.
  priority: Must Have
- id: FR-020
  category: Card Catalog
  requirement: System shall provide a card-search endpoint that accepts filters for
    colors, CMC, type, and legality, returning only cards that satisfy all supplied
    criteria.
  priority: Must Have
- id: FR-021
  category: Card Catalog
  requirement: System shall support semantic search by accepting a free-text description,
    computing an embedding, and returning the top-N Standard-legal cards ranked by
    cosine similarity.
  priority: Must Have
- id: FR-022
  category: Card Catalog
  requirement: System shall accept a JSON request describing a role and constraints
    (colors, CMC max, type, etc.) and return a bounded list of candidate cards that
    satisfy those constraints.
  priority: Must Have
- id: FR-023
  category: Card Catalog
  requirement: System shall allow the LLM to select a card by its unique ID, specify
    a quantity, and provide a reasoning field; the selection shall be verified against
    the candidate list before acceptance.
  priority: Must Have
- id: FR-024
  category: Card Catalog
  requirement: System shall enable the LLM to submit a finalized 75-card deck (60
    main + 15 sideboard) for validation, and shall reject the deck with a structured
    list of violations if any rule is broken.
  priority: Must Have
- id: FR-025
  category: Deck Import & Export
  requirement: System shall parse decklists supplied in Arena export format, extracting
    quantity, card name, set code, and collector number, and map each card to the
    internal card ID.
  priority: Must Have
- id: FR-026
  category: Deck Import & Export
  requirement: System shall parse decklists supplied in MTGO format, handling optional
    sideboard lines ("SB:"), and map each entry to the internal card ID.
  priority: Must Have
- id: FR-027
  category: Deck Import & Export
  requirement: System shall parse simple "N Card Name" lines, ignore extra whitespace,
    and map each card name case-insensitively to the internal card ID.
  priority: Must Have
- id: FR-028
  category: Deck Import & Export
  requirement: System shall provide validation feedback for imported decks, reporting
    illegal cards, quantity errors, and format violations, and suggest corrective
    actions.
  priority: Must Have
- id: FR-029
  category: Deck Import & Export
  requirement: System shall offer fuzzy-search suggestions when a card name cannot
    be matched, presenting up to three likely alternatives.
  priority: Must Have
- id: FR-030
  category: Deck Import & Export
  requirement: System shall suggest Standard-legal alternatives when a user requests
    a card that is not legal in the current format, providing up to three viable replacements.
  priority: Must Have
- id: FR-031
  category: Meta Data Management
  requirement: System shall run a scheduled job every Sunday at 06:00 UTC that scrapes
    mtgtop8.com for Standard events from the previous seven days, extracts the top-8
    decklists, and stores them in the meta database.
  priority: Must Have
- id: FR-032
  category: Meta Data Management
  requirement: System shall classify each scraped deck into an archetype and assign
    relevant tags using predefined card-presence heuristics.
  priority: Must Have
- id: FR-033
  category: Meta Data Management
  requirement: System shall compute the meta share percentage for each archetype based
    on decks collected in the most recent four-week window.
  priority: Must Have
- id: FR-034
  category: Meta Data Management
  requirement: System shall calculate the average finish position for each archetype
    using numeric conversion of finish positions (1st = 1, Top 4 = 4, etc.) over the
    same four-week window.
  priority: Must Have
- id: FR-035
  category: Meta Data Management
  requirement: System shall generate a card-pair co-occurrence matrix that records
    how many decks contain each unordered pair of cards, updating it after each successful
    scrape.
  priority: Must Have
- id: FR-036
  category: Meta Data Management
  requirement: System shall expose a meta-dashboard endpoint that returns a table
    of archetype, meta %, average finish, sample size, and top three key cards, and
    shall render this view in the UI within two seconds.
  priority: Must Have
- id: FR-037
  category: Meta Data Management
  requirement: System shall allow the deck-building AI to query the latest meta percentages
    and co-occurrence data when constructing sideboards, ensuring recommendations
    are meta-aware.
  priority: Must Have
- id: FR-038
  category: Meta Data Management
  requirement: System shall enable the AI to generate matchup explanations that reference
    current meta statistics (share, avg finish) for each archetype.
  priority: Must Have
- id: FR-039
  category: Operations & Monitoring
  requirement: System shall provide a health-check endpoint (/health/jobs) that reports
    the last success timestamp, last failure timestamp, and current status for each
    scheduled job.
  priority: Must Have
- id: FR-040
  category: Operations & Monitoring
  requirement: System shall send an alert (e.g., Slack or email) whenever a scheduled
    job fails after all retries, including job name, scheduled time, error details,
    and a link to logs.
  priority: Must Have
- id: FR-041
  category: Operations & Monitoring
  requirement: System shall implement automatic retry with exponential back-off for
    both the daily Scryfall sync and weekly mtgtop8 scrape jobs, retrying up to three
    times before marking the run as failed.
  priority: Must Have
- id: FR-042
  category: Operations & Monitoring
  requirement: System shall log detailed execution information for each scheduled
    job (job name, run ID, start/end time, duration, record counts, and any errors)
    to a centralized logging service.
  priority: Must Have
- id: FR-043
  category: Operations & Monitoring
  requirement: System shall provide a dashboard that visualizes data freshness (timestamp
    of last Scryfall sync and mtgtop8 scrape) and job success rates over the past
    30 days.
  priority: Should Have
- id: FR-044
  category: Operations & Monitoring
  requirement: System shall run a daily job at 02:00 UTC that fetches the Scryfall
    bulk data, updates the card database with new or changed Standard-legal cards,
    and marks rotated-out cards as non-legal.
  priority: Must Have
- id: FR-045
  category: Chat Interface
  requirement: System shall present a chat UI with a text input field, a Send button,
    and a visible typing indicator (“Spellbook is typing…”) while the backend processes
    a request.
  priority: Must Have
- id: FR-046
  category: Chat Interface
  requirement: System shall maintain conversation context so that after a deck is
    generated, subsequent user messages are answered with reference to the same deck
    without requiring the user to resend the deck.
  priority: Must Have
- id: FR-047
  category: Chat Interface
  requirement: System shall render card names in chat responses as clickable/hoverable
    elements; hovering displays a tooltip within 200 ms containing the high-resolution
    card image and full oracle text.
  priority: Must Have
- id: FR-048
  category: Chat Interface
  requirement: System shall provide a “Copy to Arena” button beneath each generated
    deck that copies the deck to the clipboard in Arena export format (quantity, card
    name, set code, collector number).
  priority: Must Have
- id: FR-049
  category: Chat Interface
  requirement: System shall provide an “Export MTGO” button that triggers download
    of a .txt file containing the deck in MTGO format.
  priority: Must Have
- id: FR-050
  category: Chat Interface
  requirement: System shall allow users to paste a multi-line decklist directly into
    the chat input; the backend shall parse, validate, and respond with analysis,
    errors, and improvement suggestions.
  priority: Must Have
- id: FR-051
  category: Chat Interface
  requirement: System shall persist each conversation (including deck state) in the
    database and list recent sessions on the user’s dashboard for later retrieval.
  priority: Must Have
- id: FR-052
  category: Chat Interface
  requirement: System shall return structured error messages when a user requests
    a non-existent or non-legal card, including the error type, the attempted name,
    and up to three suggested alternatives.
  priority: Must Have
- id: FR-053
  category: Deck Sharing
  requirement: System shall generate a permanent, unique shareable URL for any public
    deck, and when visited, display the deck in read-only mode with all validation
    information.
  priority: Must Have
- id: FR-054
  category: Deck Sharing
  requirement: System shall allow a user to set a deck’s privacy to Public, automatically
    creating the shareable link, and to Private, disabling link generation.
  priority: Must Have
non_functional_requirements:
- id: NFR-001
  category: Performance
  requirement: System shall generate a complete deck (including sideboard and explanations)
    and return the response to the user within 30 seconds for 95% of requests.
  priority: Must Have
- id: NFR-002
  category: Performance
  requirement: Card search (filter or semantic) shall return results within 500 ms
    for 95% of queries.
  priority: Must Have
- id: NFR-003
  category: Performance
  requirement: Meta-dashboard page shall load and render the archetype table within
    2 seconds for 95% of users.
  priority: Must Have
- id: NFR-004
  category: Data Freshness
  requirement: Card database shall be refreshed with the latest Scryfall bulk data
    at least once every 24 hours, and new Standard-legal cards shall be available
    to users within 2 hours of release.
  priority: Must Have
- id: NFR-005
  category: Data Freshness
  requirement: Meta data (archetype percentages, average finishes, co-occurrence matrix)
    shall be updated weekly and be no older than 12 hours after the scheduled mtgtop8
    scrape.
  priority: Must Have
- id: NFR-006
  category: Availability
  requirement: System shall achieve 99.5% monthly uptime, measured as the proportion
    of time the API endpoints and chat UI are reachable.
  priority: Must Have
- id: NFR-007
  category: Security
  requirement: User passwords shall be stored using a strong one-way hash (e.g., bcrypt
    with a work factor of at least 12).
  priority: Must Have
- id: NFR-008
  category: Security
  requirement: Authentication tokens shall be JSON Web Tokens signed with a server-side
    secret, have an expiration of 1 hour, and be transmitted only over HTTPS.
  priority: Must Have
- id: NFR-009
  category: Security
  requirement: Access to user-specific resources (saved decks, conversation history,
    preferences) shall be enforced via role-based access control, ensuring a user
    can only access their own data.
  priority: Must Have
- id: NFR-010
  category: Scalability
  requirement: System shall support at least 10,000 concurrent chat sessions without
    degradation of response time beyond the limits defined in NFR-001.
  priority: Should Have
- id: NFR-011
  category: Reliability
  requirement: Scheduled jobs shall automatically retry up to three times with exponential
    back-off (1 min, 2 min, 4 min) before marking the run as failed.
  priority: Must Have
- id: NFR-012
  category: Observability
  requirement: All application logs, including job execution logs and API request
    logs, shall be aggregated in a searchable central system (e.g., Loki or CloudWatch)
    and retained for at least 90 days.
  priority: Should Have
- id: NFR-013
  category: Data Protection
  requirement: System shall comply with GDPR by providing users the ability to export
    all personal data and to request permanent deletion of their account and associated
    data.
  priority: Must Have
- id: NFR-014
  category: Accessibility
  requirement: User interface shall meet WCAG 2.1 AA criteria, including keyboard
    navigation, sufficient color contrast, and screen-reader compatible markup.
  priority: Should Have
- id: NFR-015
  category: Internationalization
  requirement: System shall support at least English and Spanish languages for all
    UI text and error messages, selectable via the user preferences page.
  priority: Could Have
- id: NFR-016
  category: Rate Limiting
  requirement: API endpoints shall enforce a limit of 100 requests per minute per
    authenticated user, returning HTTP 429 when exceeded.
  priority: Must Have
