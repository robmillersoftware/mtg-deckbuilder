  priority: must_have
  status: ready
- id: 37e1856b-EP-2-US-14
  epic_id: 37e1856b-EP-2
  actor: Competitive player
  action: receive detailed explanations for any card in the generated deck on demand
  benefit: gains insight into card synergies and alternatives, enabling better decision-making
