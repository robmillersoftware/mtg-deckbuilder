  benefit: keep personal details up-to-date, improving identification and personalization
    within the app
  acceptance_criteria:
  - Profile page displays current display name, avatar, and email
  - User can modify display name and upload a new avatar image
  - Changes are saved only after the user confirms and are reflected immediately in
    the UI
  - Email field is read-only unless the user initiates an email change flow that requires
    re-verification
  - Invalid inputs (e.g., empty display name) trigger validation errors
  priority: should_have
  status: ready
- id: 37e1856b-EP-1-US-5
  epic_id: 37e1856b-EP-1
  actor: Authenticated user
  action: save a newly generated deck to their account
  benefit: preserve the deck for future reference, iteration, and sharing
  acceptance_criteria:
  - After a deck is generated, a 'Save Deck' button is visible
  - User can provide a deck name and optional description before saving
  - Saved deck appears in the user's 'My Decks' list with correct card quantities
    and sideboard
  - Deck data is persisted in the database and remains after logout and login
  - Attempting to save a deck with a duplicate name prompts the user to rename or
