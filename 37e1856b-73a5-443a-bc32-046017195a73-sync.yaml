- id: 37e1856b-EP-3-US-20
  epic_id: 37e1856b-EP-3
  actor: Competitive player
  action: search the card catalog using filters such as colors, CMC, type, and legality
  benefit: quickly find only cards that fit the desired criteria, reducing time spent
