    copy limits, and annotates each entry with the matchup(s) it addresses and a short
    rationale.
  story_id: 37e1856b-EP-2-US-13
  epic_id: null
  implementation_details: Create a SideboardGenerator service that reads the MetaSnapshotView
    (produced by the weekly MetaSnapshotCreated event), calculates weighted needs
    per archetype, queries CardInfo for viable answers, and runs an LLM prompt to
    produce justification text. Integrate with the DeckValidator to guarantee rule
    compliance. Append the sideboard to the DeckView and fire a DeckGenerated event
