- id: 39de5d20-5237-4b0a-ade2-6b218a00606b
  title: "Build the daily Scryfall bulk-data sync job: schedule it for 02:00 UTC,\
    \ download the bulk file, filter for Standard-legal cards, upsert new and changed\
    \ records, flag rotated-out cards as non-legal, wrap all DB writes in a single\
    \ transaction, and emit a structured log entry with start/end timestamps, counts\
    \ of inserted/updated/rotated records and any error details."
  story_id: 37e1856b-EP-7-US-55
  epic_id: null
  implementation_details: Use the existing job-runner framework (e.g., APScheduler
    or Celery beat) to define a recurring task. Stream the bulk CSV/JSON directly
