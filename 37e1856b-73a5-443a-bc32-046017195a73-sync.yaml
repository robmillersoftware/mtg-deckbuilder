  - Attempting to access a deleted deck URL returns a 404 or friendly not-found message
  priority: should_have
  status: ready
- id: 37e1856b-EP-1-US-8
  epic_id: 37e1856b-EP-1
  actor: Authenticated user
  action: set a deck's privacy to private or public and generate a shareable link
