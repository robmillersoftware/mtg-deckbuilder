- id: 37e1856b-EP-7-US-55
  epic_id: 37e1856b-EP-7
  actor: Operations Engineer
  action: schedule a daily job that fetches the latest Scryfall bulk data and updates
    the card database
  benefit: keeps the card catalog current so users always receive accurate, Standard-legal
    card information
  acceptance_criteria:
  - The job is automatically triggered at 02:00 UTC every day
  - It downloads the Scryfall bulk data file and parses only cards where `legalities.standard
    = "legal"`
  - New cards are inserted, changed cards are updated, and cards that rotated out
    are marked as non-legal without being deleted
  - All database changes are committed in a single transaction; if any step fails,
    no changes are persisted
  - "A log entry is created containing: start timestamp, end timestamp, number of\
    \ records inserted, updated, marked as rotated, and any error messages"
  priority: must_have
  status: ready
- id: 37e1856b-EP-7-US-56
  epic_id: 37e1856b-EP-7
  actor: Operations Engineer
  action: schedule a weekly job that scrapes mtgtop8.com for recent Standard events
    and stores tournament decks
  benefit: provides up-to-date meta data that powers deck recommendations and matchup
    analysis
  acceptance_criteria:
  - The job runs automatically every Sunday at 06:00 UTC
  - It retrieves all Standard events from the previous 7 days, extracts the top-8
    decklists, and validates each card against the card database
  - Extracted data is stored in the `events`, `decklists`, and `meta_snapshots` tables
  - The job recomputes meta percentages and the card co-occurrence matrix after ingesting
    the new decks
  - A log entry records start/end times, number of events processed, number of decklists
    stored, and any parsing warnings
  priority: must_have
  status: ready
- id: 37e1856b-EP-7-US-57
  epic_id: 37e1856b-EP-7
  actor: DevOps Engineer
  action: configure automatic retry with exponential back-off for both the Scryfall
    sync and mtgtop8 scrape jobs
  benefit: reduces transient failures and improves overall data availability without
    manual intervention
  acceptance_criteria:
  - If a job fails, it is automatically retried up to three times
  - Each retry uses exponential back-off (e.g., 1 min, 2 min, 4 min)
  - After the final retry, the job is marked as failed and no further attempts are
    made until the next scheduled run
  - All retry attempts and outcomes are logged
  priority: must_have
  status: ready
- id: 37e1856b-EP-7-US-58
  epic_id: 37e1856b-EP-7
  actor: Site Reliability Engineer
  action: receive an alert whenever a scheduled job fails after all retries
  benefit: enables rapid response to data pipeline issues, minimizing downtime for
    end-users
  acceptance_criteria:
  - An alert is sent via the configured notification channel (e.g., Slack, email)
    immediately after the final retry fails
  - The alert includes the job name, scheduled run time, error details, and a link
    to the job log
  - Alerts are not sent for successful runs or for retries that eventually succeed
  priority: must_have
  status: ready
- id: 37e1856b-EP-7-US-59
  epic_id: 37e1856b-EP-7
  actor: System Administrator
  action: access a health-check endpoint that reports the current status of each scheduled
    job
  benefit: provides a quick way to verify that data sync processes are operating correctly
  acceptance_criteria:
  - The endpoint `/health/jobs` returns a JSON payload with an entry for each job
    (Scryfall sync, mtgtop8 scrape)
  - "Each entry includes: `last_success_timestamp`, `last_failure_timestamp`, `status`\
    \ (healthy/unhealthy), and `next_scheduled_run`"
  - The endpoint responds within 200 ms and returns HTTP 200 for a healthy system,
    HTTP 503 if any job is unhealthy
  priority: should_have
  status: ready
- id: 37e1856b-EP-7-US-60
  epic_id: 37e1856b-EP-7
  actor: Product Owner
  action: view a dashboard that visualizes data freshness and job success rates over
    time
  benefit: gives stakeholders insight into the reliability of the data pipeline and
    helps prioritize improvements
  acceptance_criteria:
  - The dashboard displays the timestamp of the most recent successful Scryfall sync
    and mtgtop8 scrape
  - A line chart shows daily success/failure counts for each job over the past 30 days
  - The dashboard highlights any days with failures in red and provides a drill-down
    to view the associated log entries
  - Data on the dashboard updates automatically within 5 minutes of each job completion
  priority: should_have
  status: ready
- id: 37e1856b-EP-7-US-61
  epic_id: 37e1856b-EP-7
  actor: Operations Engineer
  action: record detailed execution logs for each run of the scheduled jobs
  benefit: facilitates troubleshooting and auditability of data ingestion processes
  acceptance_criteria:
  - Log entries are written to a centralized logging system (e.g., Loki, CloudWatch)
    with a consistent schema
  - "Each log includes: job name, run ID, start time, end time, duration, number of\
    \ records processed, number of records inserted/updated/marked, and any error\
    \ or warning messages"
  - Logs are searchable by job name, date range, and run status
  - Log retention complies with the organization’s policy (minimum 90 days)
  priority: must_have
  status: ready
- id: 37e1856b-EP-7-US-62
  epic_id: 37e1856b-EP-7
  actor: Administrator
  action: trigger the Scryfall sync or mtgtop8 scrape job manually via an admin API
  benefit: allows immediate data refresh when urgent updates are required, without
    waiting for the next scheduled run
  acceptance_criteria:
  - A POST request to `/admin/jobs/{job_name}/run` starts the specified job immediately
  - The API returns a run ID and initial status of `running`
  - The manually triggered run follows the same processing, retry, logging, and alerting
    logic as scheduled runs
  - Only users with the `admin` role can access this endpoint; unauthorized requests
    receive HTTP 403
  priority: could_have
  status: ready
- id: 37e1856b-EP-7-US-63
  epic_id: 37e1856b-EP-7
  actor: Operations Engineer
  action: view a history page that lists recent executions of each scheduled job
  benefit: provides a quick reference to verify past runs, spot trends, and access
    logs for specific executions
  acceptance_criteria:
  - "The page lists the last 50 runs for each job, showing: run ID, start time, end\
    \ time, status (success/failure), and a link to the detailed log"
  - Runs can be filtered by date range and status
  - The UI loads within 2 seconds and updates automatically after each new run
  - Pagination is available for more than 50 entries
  priority: could_have
  status: ready
