  - Explanation is limited to the context of the current deck (no unrelated information)
  - Response includes at least one concrete example of how the card contributes to
    the deck’s strategy
  priority: should_have
  status: ready
- id: 37e1856b-EP-2-US-15
  epic_id: 37e1856b-EP-2
  actor: Competitive player
  action: ask for a matchup analysis of the generated deck against the current Standard
