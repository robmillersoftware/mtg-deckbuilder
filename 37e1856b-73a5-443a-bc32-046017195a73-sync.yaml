  - All candidates meet every constraint in the request
  - Each candidate includes `id`, `name`, and `oracle_text`
  - The candidate list contains between 3 and 10 cards
  priority: must_have
  status: ready
- id: 37e1856b-EP-3-US-23
  epic_id: 37e1856b-EP-3
  actor: Deck-building AI (LLM)
  action: select a card ID and quantity from the provided candidate set
  benefit: ensures the AI’s choice is traceable to a real, legal card, enabling reliable
    deck construction
  acceptance_criteria:
  - The AI submits a JSON object with `selection` (card ID), `quantity`, and `reasoning`
  - The system verifies that the `selection` exists in the card catalog and is standard-legal
  - The system confirms that `quantity` does not exceed 4 for non-basic-land cards
  - On success, the card is added to the current deck draft and a confirmation response
    is returned
  priority: must_have
  status: ready
- id: 37e1856b-EP-3-US-24
  epic_id: 37e1856b-EP-3
  actor: Deck-building AI (LLM)
  action: finalize a 75-card deck (60 main + 15 sideboard) and request validation
  benefit: guarantees that the generated deck complies with all format rules before
    being presented to the user
  acceptance_criteria:
  - The system checks that the main deck contains exactly 60 cards and the sideboard
    exactly 15 cards
  - No card appears more than 4 copies across main deck and sideboard combined, except
    basic lands
  - All cards are marked as `is_standard_legal = true`
  - If any rule is violated, the system returns a structured error listing each issue
    (e.g., deck size mismatch, copy limit exceeded, illegal card)
  - When the deck passes all checks, the system returns a success response with the
    complete deck list
  priority: must_have
  status: ready
- id: 37e1856b-EP-3-US-25
  epic_id: 37e1856b-EP-3
  actor: Competitive player
  action: import an existing decklist in any supported format
  benefit: allows users to bring their own decks into the system for analysis, improvement,
    and validation
  acceptance_criteria:
  - The system accepts Arena, MTGO, and simple "N Card Name" formats
  - Each card name is matched against the card catalog; unmatched names trigger a
    fuzzy-search suggestion list
  - The system validates legality, copy limits, and total card counts, returning any
    errors in a clear, actionable format
  - On successful import, the deck is stored and can be used for further AI-driven
    suggestions
  priority: should_have
  status: ready
- id: 37e1856b-EP-3-US-26
  epic_id: 37e1856b-EP-3
  actor: System administrator
  action: run a daily synchronization job that updates the card catalog from Scryfall
  benefit: keeps the card database current so users always receive recommendations
    based on the latest Standard legal cards
  acceptance_criteria:
  - The job fetches the latest bulk data from Scryfall each day at 02:00 UTC
  - New cards are added, changed cards are updated, and rotated-out cards are marked
    as not standard-legal without deletion
  - The job logs the number of added, updated, and deprecated cards
  - If the job fails, an alert is generated and the previous day's data remains unchanged
  priority: could_have
  status: ready
- id: 37e1856b-EP-4-US-27
  epic_id: 37e1856b-EP-4
  actor: System Scheduler
  action: automatically scrape tournament results from mtgtop8 every week
  benefit: ensures the platform always has up-to-date tournament data for accurate
    meta analysis
  acceptance_criteria:
  - A scheduled job runs at the configured weekly time without manual intervention
  - The job fetches all Standard events from the past 7 days
  - Each fetched event includes event name, date, player name, finish position, and
    full decklist
  - Scraped data is stored in the Meta Database with a unique event_id
  - If the source site is unavailable, the job retries up to three times with exponential
    back-off and logs the failure
  priority: must_have
  status: ready
- id: 37e1856b-EP-4-US-28
  epic_id: 37e1856b-EP-4
  actor: Meta Processing Service
  action: classify each scraped deck into an archetype and assign relevant tags
  benefit: provides structured categorisation that powers meta statistics and recommendation
    logic
  acceptance_criteria:
  - Every stored decklist is processed within 30 minutes of ingestion
  - Archetype classification uses defined card-presence heuristics (e.g., ≥4 copies
    of a signature card)
  - Each deck receives an archetype name and an array of tags (e.g., ["aggro", "red",
    "mono-colored"])
  - If a deck cannot be matched to an existing archetype, it is flagged for manual
    review
  - Classification results are persisted in the Decklists table
  priority: must_have
  status: ready
- id: 37e1856b-EP-4-US-29
  epic_id: 37e1856b-EP-4
  actor: Meta Analytics Engine
  action: calculate the current meta share percentage for each archetype
  benefit: gives users a clear view of which decks dominate the Standard format, informing
    their building decisions
  acceptance_criteria:
  - Meta share is computed from all decks collected in the most recent 4-week window
  - For each archetype, meta_percentage = (number of decks of that archetype ÷ total
    decks) × 100, rounded to two decimals
  - Results are stored in the meta_snapshots table with a snapshot_date of the calculation
  - The engine updates the snapshot at least once per week after the scrape completes
  priority: must_have
  status: ready
- id: 37e1856b-EP-4-US-30
  epic_id: 37e1856b-EP-4
  actor: Meta Analytics Engine
  action: determine the average finish position for each archetype
  benefit: helps users understand which archetypes perform best in tournaments, guiding
    strategic choices
  acceptance_criteria:
  - Average finish is calculated using numeric conversion of finish_position (e.g.,
    1st = 1, Top 4 = 4, Top 8 = 8)
  - The calculation includes only decks from the same 4-week window used for meta
    share
  - The avg_finish value is stored with two decimal precision in the meta_snapshots
    table
  - Values are refreshed whenever the meta share snapshot is regenerated
  priority: should_have
  status: ready
- id: 37e1856b-EP-4-US-31
  epic_id: 37e1856b-EP-4
  actor: Co-occurrence Service
  action: generate a card-pair co-occurrence matrix from the collected decks
  benefit: enables the deck builder to suggest synergistic cards based on real tournament
    usage
  acceptance_criteria:
  - For every unique unordered pair of cards appearing together in a deck, a cooccurrence_count
    is incremented
  - Pairs with a count of zero are not stored
  - The matrix is persisted in the card_cooccurrence table with the current format
    and last_updated date
  - The matrix is recomputed after each weekly scrape and completes within a reasonable
    time (≤ 2 hours for the full dataset)
  - Counts reflect only decks from the most recent 4-week window
  priority: should_have
  status: ready
- id: 37e1856b-EP-4-US-32
  epic_id: 37e1856b-EP-4
  actor: Competitive Player (User)
  action: view the current Standard meta dashboard showing archetype percentages,
    average finishes, and key cards
  benefit: gains quick insight into the competitive landscape to make informed deck-building
    choices
  acceptance_criteria:
  - The dashboard loads within 2 seconds on the web UI
  - "It displays a table with columns: Archetype, Meta %, Avg Finish, Sample Size,\
    \ Top 3 Key Cards"
  - Data reflects the latest meta_snapshot (no older than 7 days)
  - Hovering over a key card shows its image and a brief description
  - The UI is responsive and works on desktop and tablet screen sizes
  priority: must_have
  status: ready
- id: 37e1856b-EP-4-US-33
  epic_id: 37e1856b-EP-4
  actor: Deck Builder AI (LLM)
  action: use meta share and co-occurrence data to recommend sideboard cards tailored
    to the user’s deck and current meta
  benefit: provides meta-aware sideboard suggestions that improve matchup performance
  acceptance_criteria:
  - When generating a deck, the AI queries the Meta API for the latest archetype percentages
  - The AI selects sideboard cards that appear in at least 5 % of decks opposing the
    user’s archetype and have a co-occurrence count ≥ 3 with cards in the main deck
  - 'Each sideboard recommendation includes a brief justification referencing the
    meta data (e.g., “Rending Flame - effective against Mono-Red Aggro, which currently
    holds 12 % of the meta”) '
  - All suggested cards are validated as Standard-legal before being returned
  - The sideboard contains exactly 15 cards, respecting the 4-copy limit
  priority: must_have
  status: ready
- id: 37e1856b-EP-4-US-34
  epic_id: 37e1856b-EP-4
  actor: Deck Builder AI (LLM)
  action: explain matchup strengths and weaknesses of the generated deck based on
    current meta statistics
  benefit: helps users understand how their deck performs against prevalent archetypes
    and what sideboard plans to consider
  acceptance_criteria:
  - The AI produces a matchup section that lists each top-5 archetype by meta % with
    a concise rating (Favored / Even / Unfavored)
  - For each listed archetype, the explanation references average finish data and
    highlights specific cards that counter or are vulnerable to that archetype
  - The explanation includes actionable sideboard swaps (e.g., “Swap 2 Lightning Strike
    for 2 Rending Flame against Mono-Red Aggro”)
  - All referenced cards are validated as Standard-legal
  - The section is generated within the same response as the deck list
  priority: should_have
  status: ready
- id: 37e1856b-EP-4-US-35
  epic_id: 37e1856b-EP-4
  actor: System Administrator
  action: monitor the health and freshness of meta data pipelines
  benefit: ensures reliable delivery of up-to-date meta information to users, maintaining
    trust in the platform
  acceptance_criteria:
  - A dashboard shows the timestamp of the last successful mtgtop8 scrape, meta snapshot
    generation, and co-occurrence matrix update
  - Alerts are sent via email/Slack if any pipeline fails to run within its scheduled
    window
  - Logs capture success/failure details for each step and are retained for at least
    30 days
  - The system can be manually triggered to re-run any pipeline step without data
    corruption
  priority: could_have
  status: ready
- id: 37e1856b-EP-5-US-36
  epic_id: 37e1856b-EP-5
  actor: Competitive MTG player
  action: start a new chat session and request a Standard-legal deck build
  benefit: receive a ready-to-play deck tailored to my preferences without leaving
