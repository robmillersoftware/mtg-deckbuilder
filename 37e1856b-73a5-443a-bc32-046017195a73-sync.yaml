  acceptance_criteria:
  - Conversation page lists previous sessions with timestamps and brief summaries
  - Selecting a session loads the full transcript, including user messages and assistant
    responses
  - Conversation data is persisted per user and remains available after logout and
    login
  - User can delete individual conversation entries, which removes them from storage
  priority: could_have
  status: ready
- id: 37e1856b-EP-1-US-10
  epic_id: 37e1856b-EP-1
  actor: Authenticated user
  action: set personal preferences such as default language, UI theme, and default
    deck format
  benefit: customize the application experience to match individual comfort and workflow
  acceptance_criteria:
  - Preferences page lists options for language (e.g., English, Spanish), theme (light/dark),
    and default deck format (Standard)
  - Changes are saved instantly and reflected in subsequent UI interactions
  - Preferences persist across sessions and devices for the same user account
  - Invalid selections are prevented by validation
  priority: could_have
  status: ready
- id: 37e1856b-EP-2-US-11
  epic_id: 37e1856b-EP-2
  actor: Competitive player
  action: request a new Standard deck by describing the desired archetype, colors,
    and strategy
  benefit: receives a complete, legal 60-card main deck and 15-card sideboard that
    matches current meta, saving time on deck research and construction
  acceptance_criteria:
  - The system parses the natural-language request and identifies archetype, colors,
    and strategic focus
  - The generated deck contains exactly 60 main-deck cards and 15 sideboard cards
  - All cards are Standard-legal and no card exceeds four copies across main and sideboard
  - The deck includes a concise strategy summary and a list of card quantities
  - The response includes a brief explanation for each major card choice
  priority: must_have
  status: ready
- id: 37e1856b-EP-2-US-12
  epic_id: 37e1856b-EP-2
  actor: Competitive player
  action: receive slot-by-slot card recommendations with reasoning during deck generation
  benefit: understands why each card was chosen, increasing confidence in the deck
    and facilitating learning
  acceptance_criteria:
  - For each deck slot (e.g., creature, removal, mana source) the system describes
    the role and constraints
  - The system queries the card database and presents a list of candidate cards
  - The LLM selects a single candidate, specifies the quantity, and provides a clear
    justification
  - Selected cards respect all validation rules (legality, copy limits, mana curve
    constraints)
  priority: must_have
  status: ready
- id: 37e1856b-EP-2-US-13
  epic_id: 37e1856b-EP-2
  actor: Competitive player
  action: receive a sideboard built specifically for the current meta and the generated
