- id: 37e1856b-EP-6-US-47
  epic_id: 37e1856b-EP-6
  actor: Competitive player
  action: import a decklist in MTGO format
  benefit: so I can reuse decks I have on MTGO without manually re-typing them
  acceptance_criteria:
  - The system recognises MTGO syntax, including optional "SB:" sideboard lines.
  - Card quantities and names are correctly extracted and matched to the database.
  - The deck is saved in the session with proper main-deck/sideboard classification.
  - If any line cannot be parsed, the system reports the line number and content.
  priority: must_have
  status: ready
- id: 37e1856b-EP-6-US-48
  epic_id: 37e1856b-EP-6
  actor: Competitive player
  action: import a simple text decklist ("4 Card Name" per line)
  benefit: so I can paste any free-form list I have without worrying about exact formatting
  acceptance_criteria:
  - The parser accepts lines consisting of a quantity followed by a card name, ignoring
