  - If the deck is invalid, the export button is disabled and an error message is
    shown.
  priority: must_have
  status: ready
- id: 37e1856b-EP-6-US-53
  epic_id: 37e1856b-EP-6
  actor: Competitive player
  action: generate a shareable link for my deck
  benefit: so I can easily send the deck to friends or post it online without attaching
