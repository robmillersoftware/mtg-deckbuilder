  - Each returned card satisfies the standard-legal constraint
  - The list includes at least 5 candidates and no more than 20
  - Results are returned within 1 second
  priority: must_have
  status: ready
- id: 37e1856b-EP-3-US-22
  epic_id: 37e1856b-EP-3
  actor: Deck-building AI (LLM)
  action: request a candidate set of cards that satisfy a specific role and constraint
    description
  benefit: provides the AI with a bounded, valid pool of options, preventing hallucination
