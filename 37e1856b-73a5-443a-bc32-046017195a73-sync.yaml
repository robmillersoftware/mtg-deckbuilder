  acceptance_criteria:
  - The UI displays a text input field and a Send button.
  - When the user submits a request (e.g., "Build me a mono-red aggro deck"), the
    system returns a chat bubble containing a full 60-card main deck and a 15-card
    sideboard.
  - All returned cards are present in the card database and marked as Standard-legal.
  - The response includes the deck name, format, and a clear list of card names with
    quantities.
  priority: must_have
  status: ready
- id: 37e1856b-EP-5-US-37
  epic_id: 37e1856b-EP-5
  actor: Competitive MTG player
  action: continue the conversation with the same deck context across multiple messages
  benefit: avoid re-entering the deck each time I ask follow-up questions, making
