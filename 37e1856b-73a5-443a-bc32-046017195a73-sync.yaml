  story_id: 37e1856b-EP-2-US-11
  epic_id: null
  implementation_details: Create a RequestParser service that uses regex + LLM prompting
    to identify archetype, colors and goals. Wire a DeckSynthesizer component that
    queries the CardInfo store, runs a constrained optimization (mana curve, copy
    limits) and calls the LLM for justification strings. Validate the result with
    the central DeckValidator (see Story 9) before persisting to the DeckView aggregate.
    Follow the existing async command-handler pattern for the GenerateDeck command.
