  - The system can retrieve a conversation by its ID via the GET /api/conversations/{id}
    endpoint.
  priority: should_have
  status: ready
- id: 37e1856b-EP-5-US-44
  epic_id: 37e1856b-EP-5
  actor: Competitive MTG player
  action: ask a card-specific question (e.g., "Why is Lightning Strike in the deck?")
