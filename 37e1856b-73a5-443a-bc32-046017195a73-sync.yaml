description: "# MTG Deck Builder - Product Specification\n\n## Product Overview\n\n\
  ### Name\nSpellbook (working title)\n\n### Vision\nAn AI-powered Magic: The Gathering\
  \ deck builder that only recommends real, format-legal cards. The system uses tournament\
  \ data to understand the current meta and builds competitive 75-card decks with\
  \ full sideboard guides.\n\n### Target Users\n- Competitive MTG players who want\
  \ deck ideas\n- Players returning to the game who need to understand the current\
  \ meta\n- Brewers who want AI assistance exploring archetypes\n- Players preparing\
  \ for tournaments who need sideboard help\n\n### Core Value Proposition\nUnlike\
  \ generic LLMs that hallucinate card names and ignore format legality, Spellbook\
  \ is grounded in real card data and real tournament results. Every card it suggests\
  \ exists, is legal in your format, and has a reason for being there.\n\n---\n\n\
  ## Technical Architecture\n\n### System Components\n\n```\n┌─────────────────────────────────────────────────────┐\n\
  │                 Chat Interface                       │\n│  React frontend with\
  \ conversation UI                │\n│  Deck display (text-based, organized by type)\
  \       │\n│  Card hover/click for details                       │\n└─────────────────────────────────────────────────────┘\n\
  \                         │\n                    REST API\n                    \
  \     │\n┌─────────────────────────────────────────────────────┐\n│            \
  \     Backend (FastAPI)                    │\n│  - Chat endpoint               \
  \                     │\n│  - Deck generation orchestration                    │\n\
  │  - Card search/validation                           │\n│  - Meta analysis    \
  \                                │\n└─────────────────────────────────────────────────────┘\n\
  \           │                        │\n┌──────────────────────┐  ┌──────────────────────────┐\n\
  │    Card Database     │  │     Meta Database        │\n│    (PostgreSQL)      │\
  \  │     (PostgreSQL)         │\n│                      │  │                   \
  \       │\n│  - Scryfall data     │  │  - Tournament decks      │\n│  - Standard-legal\
  \    │  │  - Archetype tags        │\n│  - Oracle text       │  │  - Card co-occurrence\
  \    │\n│  - Card embeddings   │  │  - Meta percentages      │\n└──────────────────────┘\
  \  └──────────────────────────┘\n```\n\n### Technology Stack\n- **Frontend**: React\
  \ (chat interface, deck display)\n- **Backend**: FastAPI (Python)\n- **Database**:\
  \ PostgreSQL\n- **LLM**: Claude API (via Anthropic)\n- **Vector Search**: pgvector\
  \ for card embeddings\n- **Data Sources**: Scryfall API, mtgtop8.com scraping\n\n\
  ---\n\n## Data Pipeline\n\n### Card Database (Scryfall Sync)\n\n**Source**: Scryfall\
  \ API (https://scryfall.com/docs/api)\n\n**Sync frequency**: Daily\n\n**Data captured\
  \ per card**:\n- `scryfall_id`: Unique identifier\n- `name`: Card name\n- `mana_cost`:\
  \ Mana cost string (e.g., \"{1}{R}{R}\")\n- `cmc`: Converted mana cost (numeric)\n\
  - `type_line`: Full type line (e.g., \"Creature - Human Wizard\")\n- `oracle_text`:\
  \ Rules text\n- `power`: Power (if creature)\n- `toughness`: Toughness (if creature)\n\
  - `colors`: Color identity array\n- `color_identity`: Commander color identity\n\
  - `keywords`: Keyword abilities array\n- `legalities`: Object with format legality\n\
  - `set_code`: Set code\n- `rarity`: common/uncommon/rare/mythic\n- `image_uri`:\
  \ Card image URL\n- `embedding`: Vector embedding of oracle text + type (for semantic\
  \ search)\n\n**Filtering**: Only store cards where `legalities.standard = \"legal\"\
  `\n\n**Update logic**:\n- Check Scryfall bulk data endpoint for updates\n- Diff\
  \ against existing data\n- Update changed cards, add new cards\n- Mark rotated cards\
  \ as no longer Standard-legal\n\n### Meta Database (mtgtop8 Scraping)\n\n**Source**:\
  \ mtgtop8.com Standard events\n\n**Scrape frequency**: Weekly\n\n**Data captured**:\n\
  \n**Events table**:\n- `event_id`: Unique identifier\n- `event_name`: Tournament\
  \ name\n- `event_date`: Date of event\n- `format`: \"Standard\"\n- `num_players`:\
  \ Player count (if available)\n\n**Decklists table**:\n- `decklist_id`: Unique identifier\n\
  - `event_id`: Foreign key to event\n- `player_name`: Player name\n- `finish_position`:\
  \ 1st, 2nd, Top 4, Top 8, etc.\n- `archetype`: Archetype classification (see below)\n\
  - `main_deck`: JSON array of {card_name, quantity}\n- `sideboard`: JSON array of\
  \ {card_name, quantity}\n\n**Archetype classification**:\n- Parse deck contents\
  \ to classify archetype\n- Use card presence heuristics (e.g., 4x Monastery Swiftspear\
  \ = likely Red Aggro)\n- Store as tags: [\"aggro\", \"red\", \"mono-colored\"]\n\
  \n**Derived data (computed after scrape)**:\n\n**Meta share table**:\n- `archetype`:\
  \ Archetype name\n- `meta_percentage`: % of recent tournament decks\n- `avg_finish`:\
  \ Average finish position\n- `sample_size`: Number of decks in sample\n- `date_computed`:\
  \ When this was calculated\n\n**Card co-occurrence matrix**:\n- For each pair of\
  \ cards that appear together in decks\n- Store co-occurrence count\n- Use for synergy\
  \ recommendations\n\n---\n\n## Anti-Hallucination System\n\n### The Problem\nLLMs\
  \ hallucinate MTG cards. They will confidently suggest:\n- Cards that don't exist\
  \ (\"Flame Burst\" instead of \"Lightning Strike\")\n- Cards not legal in the format\
  \ (Modern cards in Standard)\n- Banned cards\n- Cards with incorrect rules text\n\
  \n### The Solution: Constrained Card Selection\n\nThe LLM never outputs raw card\
  \ names in final recommendations. Instead:\n\n**Step 1: LLM describes what it needs**\n\
  ```json\n{\n  \"role\": \"removal\",\n  \"description\": \"instant-speed damage\
  \ spell that can hit creatures or players\",\n  \"constraints\": {\n    \"cmc_max\"\
  : 3,\n    \"colors\": [\"R\"],\n    \"type\": \"instant\"\n  }\n}\n```\n\n**Step\
  \ 2: System queries card database**\n```sql\nSELECT * FROM cards\nWHERE 'R' = ANY(colors)\n\
  \  AND cmc <= 3\n  AND type_line ILIKE '%instant%'\n  AND legalities->>'standard'\
  \ = 'legal'\nORDER BY embedding <-> query_embedding\nLIMIT 10;\n```\n\n**Step 3:\
  \ Return candidates to LLM**\n```json\n{\n  \"candidates\": [\n    {\"id\": \"abc123\"\
  , \"name\": \"Lightning Strike\", \"oracle_text\": \"...\"},\n    {\"id\": \"def456\"\
  , \"name\": \"Play with Fire\", \"oracle_text\": \"...\"},\n    {\"id\": \"ghi789\"\
  , \"name\": \"Volcanic Spite\", \"oracle_text\": \"...\"}\n  ]\n}\n```\n\n**Step\
  \ 4: LLM selects by ID**\n```json\n{\n  \"selection\": \"abc123\",\n  \"quantity\"\
  : 4,\n  \"reasoning\": \"Lightning Strike is the most efficient option at 2 mana\
  \ for 3 damage\"\n}\n```\n\n**Step 5: Final validation**\n- Verify card ID exists\
  \ in database\n- Verify card is Standard-legal\n- Verify not on banned list\n- Accumulate\
  \ into deck, checking 4-of limit\n\n### Validation Rules\n\n**Main deck**:\n- Exactly\
  \ 60 cards\n- Maximum 4 copies of any non-basic-land card\n- All cards must be Standard-legal\n\
  - No banned cards\n\n**Sideboard**:\n- Exactly 15 cards\n- Combined with main deck,\
  \ still max 4 copies of any card\n- All cards must be Standard-legal\n- No banned\
  \ cards\n\n**If validation fails**:\n- Return error to LLM with specific issue\n\
  - LLM must retry with corrected selection\n- Max 3 retries before failing gracefully\n\
  \n---\n\n## Core Features\n\n### Feature 1: Deck Generation\n\n**User input**: Natural\
  \ language description of desired deck\n- \"Build me an aggressive red deck\"\n\
  - \"I want a control deck that uses counterspells and card draw\"\n- \"Make a midrange\
  \ deck around [specific card]\"\n\n**Process**:\n1. LLM analyzes request, determines\
  \ archetype direction\n2. LLM queries meta database for similar successful decks\n\
  3. LLM builds deck skeleton (creature count, removal count, land count)\n4. For\
  \ each slot, LLM describes need → system finds candidates → LLM selects\n5. Repeat\
  \ for sideboard, with matchup context\n6. Validate complete 75\n7. Generate explanations\
  \ for key card choices\n\n**Output**:\n```\n## Mono-Red Aggro\n\n### Strategy\n\
  This deck aims to kill the opponent as quickly as possible using\nefficient creatures\
  \ and burn spells. Ideal game plan is creatures\non turns 1-2, then burn to finish.\n\
  \n### Main Deck (60)\n\n**Creatures (20)**\n4 Monastery Swiftspear\n4 Phoenix Chick\n\
  4 Feldon, Ronom Excavator\n4 Squee, Dubious Monarch\n4 Thundering Raiju\n\n**Instants\
  \ (12)**\n4 Lightning Strike\n4 Play with Fire\n4 Searing Blood\n\n**Sorceries (4)**\n\
  4 Light Up the Stage\n\n**Enchantments (4)**\n4 Kumano Faces Kakkazan\n\n**Lands\
  \ (20)**\n18 Mountain\n2 Sokenzan, Crucible of Defiance\n\n### Sideboard (15)\n\
  3 Rending Flame - Bring in against white/blue decks with angels\n2 Abrade - Bring\
  \ in against artifact-heavy decks\n3 Roiling Vortex - Bring in against lifegain\
  \ strategies\n4 Leyline of Combustion - Bring in against removal-heavy control\n\
  3 Experimental Synthesizer - Bring in for grindy matchups\n\n### Key Matchups\n\
  - vs Azorius Control: Aggressive mulligan for 1-drops...\n- vs Domain Ramp: Race\
  \ them, don't let them stabilize...\n- vs Mirror: Board out X, bring in Y...\n```\n\
  \n### Feature 2: Card Explanation\n\n**User input**: Question about a specific card\
  \ in context\n- \"Why Lightning Strike over Play with Fire?\"\n- \"What does Monastery\
  \ Swiftspear do in this deck?\"\n- \"Is 20 lands enough?\"\n\n**Process**:\n1. Retrieve\
  \ card details from database\n2. Retrieve deck context\n3. LLM explains role, synergies,\
  \ and alternatives\n\n**Output**:\n```\n## Why Lightning Strike over Play with Fire?\n\
  \nBoth deal 2 damage for 2 mana, but Lightning Strike deals 3 damage.\nThe extra\
  \ point matters for:\n- Killing 3-toughness creatures (common in current meta)\n\
  - Faster clock on opponent's life total\n- Play with Fire's scry 1 is nice but not\
  \ worth the damage difference\n\nIf you're on a budget, Play with Fire is an acceptable\
  \ substitute.\n```\n\n### Feature 3: Matchup Analysis\n\n**User input**: Question\
  \ about matchups or meta positioning\n- \"How does this deck do against control?\"\
  \n- \"What's the current Standard meta?\"\n- \"What beats Domain Ramp?\"\n\n**Process**:\n\
  1. Query meta database for current meta share\n2. Analyze deck composition against\
  \ known archetypes\n3. LLM provides matchup assessment with sideboard guide\n\n\
  **Output**:\n```\n## Current Standard Meta (as of [date])\n\n| Archetype | Meta\
  \ % | Your Matchup |\n|-----------|--------|--------------|\n| Domain Ramp | 18%\
  \ | Slightly favored |\n| Azorius Control | 15% | Even |\n| Mono-Red Aggro | 12%\
  \ | Mirror |\n| Esper Midrange | 11% | Unfavored |\n| Mono-White Aggro | 9% | Favored\
  \ |\n\n## Detailed: vs Esper Midrange\n\nThis is your hardest matchup. They have:\n\
  - Efficient removal (Cut Down, Go for the Throat)\n- Lifegain (Sheoldred)\n- Card\
  \ advantage (Raffine)\n\n**Sideboard plan**:\nOut: 4 Searing Blood, 2 Phoenix Chick\n\
  In: 4 Leyline of Combustion, 2 Experimental Synthesizer\n\n**Key cards to play around**:\
  \ ...\n```\n\n### Feature 4: Deck Iteration\n\n**User input**: Request to modify\
  \ existing deck\n- \"Make this deck faster\"\n- \"Add more interaction to the sideboard\"\
  \n- \"I want to splash blue for [card]\"\n- \"Replace [card] with something similar\"\
  \n\n**Process**:\n1. Parse existing decklist\n2. Understand modification request\n\
  3. Identify cards to remove\n4. Find replacements using constrained selection\n\
  5. Revalidate 75\n6. Explain changes\n\n**Output**:\n```\n## Changes Made\n\n**Out**:\n\
  - 2 Thundering Raiju (too slow for faster build)\n- 2 Sokenzan (enters tapped)\n\
  \n**In**:\n- 4 Reinforced Ronin (immediate damage, can re-cast)\n\n**Reasoning**:\n\
  Cutting the top of your curve makes the deck more consistent\nat closing games by\
  \ turn 4-5. Thundering Raiju is powerful\nbut often too slow against the current\
  \ meta.\n\n**Updated mana curve**:\n1-drop: 12 → 16\n2-drop: 12 → 12\n3-drop: 4\
  \ → 4\n4-drop: 4 → 0\n```\n\n### Feature 5: Deck Import\n\n**User input**: Paste\
  \ existing decklist\n- Arena export format\n- MTGO format\n- Simple \"4 Card Name\"\
  \ format\n\n**Process**:\n1. Parse decklist (handle multiple formats)\n2. Validate\
  \ each card against database\n3. Flag any issues (illegal cards, wrong quantities)\n\
  4. Store deck for analysis/iteration\n\n**Supported formats**:\n```\n// Arena format\n\
  4 Lightning Strike (DMU) 137\n4 Play with Fire (MID) 154\n\n// Simple format\n4\
  \ Lightning Strike\n4 Play with Fire\n\n// MTGO format\n4 Lightning Strike\n4 Play\
  \ with Fire\nSB: 3 Rending Flame\n```\n\n**Output on invalid cards**:\n```\n## Import\
  \ Issues\n\nThe following cards could not be validated:\n- \"Lighting Strike\" -\
  \ Did you mean \"Lightning Strike\"?\n- \"Counterspell\" - Not legal in Standard.\
  \ Similar options: Negate, Make Disappear\n\n[Fix and re-import] or [Auto-correct]\n\
  ```\n\n---\n\n## User Interface\n\n### Chat Interface\n\n**Layout**:\n```\n┌─────────────────────────────────────────────────────────────┐\n\
  │  Spellbook - Standard Deck Builder                    [?]   │\n├─────────────────────────────────────────────────────────────┤\n\
  │                                                             │\n│  ┌─────────────────────────────────────────────────────┐\
  \   │\n│  │ User: Build me a mono-red aggro deck               │   │\n│  └─────────────────────────────────────────────────────┘\
  \   │\n│                                                             │\n│  ┌─────────────────────────────────────────────────────┐\
  \   │\n│  │ Spellbook: I'll build you a mono-red aggro deck    │   │\n│  │ optimized\
  \ for the current Standard meta.           │   │\n│  │                         \
  \                            │   │\n│  │ ## Mono-Red Aggro                     \
  \             │   │\n│  │                                                     │\
  \   │\n│  │ ### Main Deck (60)                                 │   │\n│  │ **Creatures\
  \ (20)**                                 │   │\n│  │ 4 Monastery Swiftspear    \
  \                        │   │\n│  │ 4 Phoenix Chick                           \
  \         │   │\n│  │ ...                                                │   │\n\
  │  │                                                     │   │\n│  │ [Copy to Arena]\
  \ [Export MTGO]                      │   │\n│  └─────────────────────────────────────────────────────┘\
  \   │\n│                                                             │\n│  ┌─────────────────────────────────────────────────────┐\
  \   │\n│  │ User: Why Monastery Swiftspear?                    │   │\n│  └─────────────────────────────────────────────────────┘\
  \   │\n│                                                             │\n│  ┌─────────────────────────────────────────────────────┐\
  \   │\n│  │ Spellbook: Monastery Swiftspear is the best        │   │\n│  │ 1-drop\
  \ in red aggro because...                     │   │\n│  └─────────────────────────────────────────────────────┘\
  \   │\n│                                                             │\n├─────────────────────────────────────────────────────────────┤\n\
  │  [Type your message...]                          [Send]     │\n└─────────────────────────────────────────────────────────────┘\n\
  ```\n\n**Card references**:\n- Card names in responses are clickable/hoverable\n\
  - Show card image + oracle text on hover\n- Pull image from Scryfall\n\n**Deck export**:\n\
  - \"Copy to Arena\" button copies Arena-format text\n- \"Export MTGO\" downloads\
  \ .txt file\n- \"Share\" generates shareable link (v2)\n\n### Conversation Features\n\
  \n**Conversation memory**:\n- Remember current deck being discussed\n- Remember\
  \ previous questions in session\n- Allow follow-up questions without re-stating\
  \ deck\n\n**Suggested prompts**:\n- After deck generation: \"Explain the sideboard\"\
  \ / \"Show matchups\" / \"Make it faster\"\n- After card question: \"What are alternatives?\"\
  \ / \"Show similar cards\"\n\n---\n\n## Data Sync Jobs\n\n### Scryfall Daily Sync\n\
  \n**Schedule**: 2:00 AM UTC daily\n\n**Process**:\n1. Fetch Scryfall bulk data (default\
  \ cards)\n2. Filter to Standard-legal cards\n3. Compare against existing database\n\
  4. Update changed cards\n5. Add new cards with embeddings\n6. Mark rotated-out cards\n\
  7. Log sync results\n\n**Error handling**:\n- Retry 3x with exponential backoff\n\
  - Alert on failure\n- Never delete cards during sync (only mark as rotated)\n\n\
  ### mtgtop8 Weekly Scrape\n\n**Schedule**: Sunday 6:00 AM UTC\n\n**Process**:\n\
  1. Fetch recent Standard events (last 7 days)\n2. For each event, fetch top 8 decklists\n\
  3. Parse decklists into structured format\n4. Classify archetypes\n5. Validate all\
  \ card names against card database\n6. Store events and decklists\n7. Recompute\
  \ meta percentages\n8. Recompute card co-occurrence matrix\n\n**Scraping ethics**:\n\
  - Respect robots.txt\n- Rate limit requests (1 per second)\n- Cache responses\n\
  - Identify as bot in user-agent\n\n**Error handling**:\n- Skip malformed decklists\
  \ (log warning)\n- Continue on individual deck failures\n- Alert if >50% of decks\
  \ fail\n\n---\n\n## API Endpoints\n\n### Chat Endpoint\n\n**POST /api/chat**\n\n\
  Request:\n```json\n{\n  \"message\": \"Build me a mono-red aggro deck\",\n  \"conversation_id\"\
  : \"uuid-optional\",\n  \"current_deck\": null\n}\n```\n\nResponse:\n```json\n{\n\
  \  \"response\": \"I'll build you a mono-red aggro deck...\",\n  \"deck\": {\n \
  \   \"name\": \"Mono-Red Aggro\",\n    \"format\": \"standard\",\n    \"main_deck\"\
  : [\n      {\"card_id\": \"abc123\", \"name\": \"Monastery Swiftspear\", \"quantity\"\
  : 4}\n    ],\n    \"sideboard\": [\n      {\"card_id\": \"xyz789\", \"name\": \"\
  Rending Flame\", \"quantity\": 3}\n    ]\n  },\n  \"conversation_id\": \"uuid\"\n\
  }\n```\n\n### Card Search Endpoint\n\n**GET /api/cards/search**\n\nQuery params:\n\
  - `q`: Text search (name, oracle text)\n- `colors`: Color filter (W, U, B, R, G)\n\
  - `cmc_max`: Max converted mana cost\n- `type`: Type filter (creature, instant,\
  \ etc.)\n- `limit`: Max results (default 20)\n\nResponse:\n```json\n{\n  \"cards\"\
  : [\n    {\n      \"id\": \"abc123\",\n      \"name\": \"Lightning Strike\",\n \
  \     \"mana_cost\": \"{1}{R}\",\n      \"type_line\": \"Instant\",\n      \"oracle_text\"\
  : \"Lightning Strike deals 3 damage to any target.\",\n      \"image_uri\": \"https://...\"\
  \n    }\n  ]\n}\n```\n\n### Card Detail Endpoint\n\n**GET /api/cards/{card_id}**\n\
  \nResponse:\n```json\n{\n  \"id\": \"abc123\",\n  \"name\": \"Lightning Strike\"\
  ,\n  \"mana_cost\": \"{1}{R}\",\n  \"cmc\": 2,\n  \"type_line\": \"Instant\",\n\
  \  \"oracle_text\": \"Lightning Strike deals 3 damage to any target.\",\n  \"colors\"\
  : [\"R\"],\n  \"legalities\": {\"standard\": \"legal\", \"modern\": \"legal\"},\n\
  \  \"image_uri\": \"https://...\",\n  \"tournament_play\": {\n    \"decks_containing\"\
  : 342,\n    \"avg_copies\": 3.8,\n    \"common_archetypes\": [\"Mono-Red Aggro\"\
  , \"Gruul Midrange\"]\n  }\n}\n```\n\n### Meta Endpoint\n\n**GET /api/meta**\n\n\
  Response:\n```json\n{\n  \"format\": \"standard\",\n  \"last_updated\": \"2024-01-15\"\
  ,\n  \"archetypes\": [\n    {\n      \"name\": \"Domain Ramp\",\n      \"meta_percentage\"\
  : 18.5,\n      \"sample_size\": 47,\n      \"avg_finish\": 4.2,\n      \"key_cards\"\
  : [\"Atraxa, Grand Unifier\", \"Leyline Binding\"]\n    }\n  ]\n}\n```\n\n### Deck\
  \ Import Endpoint\n\n**POST /api/decks/import**\n\nRequest:\n```json\n{\n  \"decklist_text\"\
  : \"4 Lightning Strike\\n4 Play with Fire\\n...\",\n  \"format\": \"arena\"\n}\n\
  ```\n\nResponse:\n```json\n{\n  \"valid\": true,\n  \"deck\": {\n    \"main_deck\"\
  : [...],\n    \"sideboard\": [...]\n  },\n  \"warnings\": [],\n  \"errors\": []\n\
  }\n```\n\n### Deck Export Endpoint\n\n**GET /api/decks/{deck_id}/export?format=arena**\n\
  \nResponse:\n```\n4 Lightning Strike (DMU) 137\n4 Play with Fire (MID) 154\n...\n\
  ```\n\n---\n\n## Conversation Flows\n\n### Flow 1: New Deck Generation\n\n```\n\
  User: Build me a control deck with blue and white\n\nSystem:\n1. Parse intent: control\
  \ archetype, colors UW\n2. Query meta DB for UW Control reference decks\n3. Build\
  \ deck skeleton based on control template\n4. For each slot:\n   a. LLM describes\
  \ need\n   b. Query card DB with constraints\n   c. LLM selects from candidates\n\
  5. Build sideboard with meta-aware choices\n6. Validate 60+15\n7. Generate response\
  \ with explanations\n\nResponse: Here's an Azorius Control deck optimized for the\
  \ current meta...\n[Full 75-card list with explanations]\n```\n\n### Flow 2: Card\
  \ Explanation\n\n```\nUser: Why is The Wandering Emperor in the deck?\n\nSystem:\n\
  1. Identify card reference in context of current deck\n2. Retrieve card details\
  \ from DB\n3. Retrieve deck archetype and strategy\n4. LLM explains role in this\
  \ specific deck\n\nResponse: The Wandering Emperor serves multiple roles in this\
  \ control shell:\n- Flash threat that dodges sorcery-speed removal\n- Exile removal\
  \ for creatures\n- Lifegain against aggro\n- Win condition that's hard to answer\n\
  ```\n\n### Flow 3: Matchup Analysis\n\n```\nUser: How do I beat mono-red?\n\nSystem:\n\
  1. Identify \"mono-red\" as archetype (Mono-Red Aggro)\n2. Query meta DB for mono-red\
  \ deck composition\n3. Analyze current deck's answers to that strategy\n4. Generate\
  \ sideboard guide\n\nResponse: Mono-Red Aggro is about 12% of the meta. Your matchup\
  \ is:\n[Detailed analysis]\n[Sideboard plan: In/Out]\n[Key cards to play around]\n\
  ```\n\n### Flow 4: Deck Iteration\n\n```\nUser: I want to add black for Sheoldred\n\
  \nSystem:\n1. Understand modification: splash black, add Sheoldred\n2. Identify\
  \ mana base changes needed\n3. Identify cuts to make room\n4. Validate new 75 (still\
  \ legal, still 60+15)\n5. Assess impact on matchups\n\nResponse: Adding black for\
  \ Sheoldred transforms this into Esper Control.\nHere's the updated list:\n[Changes\
  \ made]\n[New mana base]\n[Matchup impact]\n```\n\n### Flow 5: Deck Import and Analysis\n\
  \n```\nUser: [Pastes decklist]\n\nSystem:\n1. Parse decklist format\n2. Validate\
  \ each card against DB\n3. Identify archetype\n4. Analyze strengths/weaknesses\n\
  5. Compare to meta reference decks\n\nResponse: I've imported your Boros Convoke\
  \ deck. Here's my analysis:\n[Archetype classification]\n[Comparison to tournament\
  \ lists]\n[Suggested improvements]\n[Matchup overview]\n```\n\n---\n\n## Error Handling\n\
  \n### Card Not Found\n\nWhen the LLM references a card that doesn't exist:\n\n```\n\
  LLM attempts: \"Add 4 Flame Burst\"\n\nSystem:\n1. Query DB for \"Flame Burst\"\
  \ - no match\n2. Fuzzy search for similar names\n3. Return error to LLM with suggestions\n\
  \nError response to LLM:\n{\n  \"error\": \"card_not_found\",\n  \"attempted\":\
  \ \"Flame Burst\",\n  \"suggestions\": [\"Flame Slash\", \"Burst Lightning\", \"\
  Lightning Strike\"],\n  \"instruction\": \"Select from suggestions or describe what\
  \ you need\"\n}\n```\n\n### Format Legality Violation\n\nWhen a card isn't Standard-legal:\n\
  \n```\nLLM attempts: \"Add 4 Counterspell\"\n\nSystem:\n1. Query DB - card exists\
  \ but legalities.standard != \"legal\"\n2. Return error with Standard-legal alternatives\n\
  \nError response to LLM:\n{\n  \"error\": \"not_standard_legal\",\n  \"card\": \"\
  Counterspell\",\n  \"legal_in\": [\"legacy\", \"modern\", \"vintage\", \"commander\"\
  ],\n  \"standard_alternatives\": [\"Make Disappear\", \"Negate\", \"Essence Scatter\"\
  ],\n  \"instruction\": \"Select a Standard-legal alternative\"\n}\n```\n\n### Deck\
  \ Validation Failure\n\nWhen the 75-card deck doesn't validate:\n\n```\nSystem validates\
  \ completed deck:\n- Main deck: 62 cards (ERROR: must be 60)\n- Sideboard: 15 cards\
  \ (OK)\n- 5 copies of Lightning Strike (ERROR: max 4)\n\nError response to LLM:\n\
  {\n  \"error\": \"deck_validation_failed\",\n  \"issues\": [\n    {\"type\": \"\
  main_deck_size\", \"expected\": 60, \"actual\": 62},\n    {\"type\": \"card_limit_exceeded\"\
  , \"card\": \"Lightning Strike\", \"count\": 5, \"max\": 4}\n  ],\n  \"instruction\"\
  : \"Remove 2 cards from main deck and reduce Lightning Strike to 4 copies\"\n}\n\
  ```\n\n---\n\n## LLM Prompt Engineering\n\n### System Prompt (Core)\n\n```\nYou\
  \ are Spellbook, an expert Magic: The Gathering deck builder specializing in Standard\
  \ format.\n\nCRITICAL RULES:\n1. You can ONLY recommend cards that exist in the\
  \ card database\n2. You can ONLY recommend Standard-legal cards\n3. Main decks must\
  \ be EXACTLY 60 cards\n4. Sideboards must be EXACTLY 15 cards\n5. Maximum 4 copies\
  \ of any card (except basic lands)\n\nWhen building a deck:\n1. First, analyze what\
  \ the user wants (archetype, colors, strategy)\n2. Reference tournament data for\
  \ successful similar decks\n3. For each card slot, describe what you need, then\
  \ select from provided options\n4. Always explain WHY each card is included\n5.\
  \ Build a complete sideboard with matchup-specific cards\n\nYou have access to:\n\
  - Current Standard card pool (via search)\n- Recent tournament results and meta\
  \ data\n- Card co-occurrence data (what cards are played together)\n\nNever invent\
  \ cards. Never recommend cards outside the provided options.\n```\n\n### Card Selection\
  \ Prompt\n\n```\nYou need to fill the following deck slot:\n- Role: {role description}\n\
  - Constraints: {color, cmc, type constraints}\n\nAvailable options from the card\
  \ database:\n{list of candidate cards with oracle text}\n\nSelect the best option\
  \ and explain why. Respond with:\n{\n  \"selection\": \"card_id\",\n  \"quantity\"\
  : N,\n  \"reasoning\": \"explanation\"\n}\n```\n\n### Sideboard Construction Prompt\n\
  \n```\nBuild a 15-card sideboard for this deck:\n{main deck list}\n\nCurrent meta\
  \ breakdown:\n{archetype percentages and key cards}\n\nFor each sideboard card,\
  \ specify:\n1. What matchups it's for\n2. What you board out to bring it in\n3.\
  \ Why this card over alternatives\n\nAvailable sideboard options:\n{list of candidate\
  \ cards}\n```\n\n---\n\n## Database Schema\n\n### Cards Table\n\n```sql\nCREATE\
  \ TABLE cards (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    scryfall_id\
  \ VARCHAR(36) UNIQUE NOT NULL,\n    name VARCHAR(255) NOT NULL,\n    mana_cost VARCHAR(50),\n\
  \    cmc DECIMAL(4,1),\n    type_line VARCHAR(255),\n    oracle_text TEXT,\n   \
  \ power VARCHAR(10),\n    toughness VARCHAR(10),\n    colors VARCHAR(5)[], -- Array\
  \ of W, U, B, R, G\n    color_identity VARCHAR(5)[],\n    keywords VARCHAR(100)[],\n\
  \    legalities JSONB,\n    set_code VARCHAR(10),\n    rarity VARCHAR(20),\n   \
  \ image_uri TEXT,\n    embedding VECTOR(1536), -- For semantic search\n    created_at\
  \ TIMESTAMP DEFAULT NOW(),\n    updated_at TIMESTAMP DEFAULT NOW(),\n    is_standard_legal\
  \ BOOLEAN GENERATED ALWAYS AS\n        ((legalities->>'standard') = 'legal') STORED\n\
  );\n\nCREATE INDEX idx_cards_standard ON cards(is_standard_legal) WHERE is_standard_legal\
  \ = true;\nCREATE INDEX idx_cards_name ON cards(name);\nCREATE INDEX idx_cards_colors\
  \ ON cards USING GIN(colors);\nCREATE INDEX idx_cards_embedding ON cards USING ivfflat(embedding\
  \ vector_cosine_ops);\n```\n\n### Events Table\n\n```sql\nCREATE TABLE events (\n\
  \    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    source VARCHAR(50) NOT\
  \ NULL, -- 'mtgtop8'\n    source_id VARCHAR(100),\n    event_name VARCHAR(255) NOT\
  \ NULL,\n    event_date DATE NOT NULL,\n    format VARCHAR(50) NOT NULL,\n    num_players\
  \ INTEGER,\n    created_at TIMESTAMP DEFAULT NOW(),\n    UNIQUE(source, source_id)\n\
  );\n\nCREATE INDEX idx_events_format_date ON events(format, event_date DESC);\n\
  ```\n\n### Decklists Table\n\n```sql\nCREATE TABLE decklists (\n    id UUID PRIMARY\
  \ KEY DEFAULT gen_random_uuid(),\n    event_id UUID REFERENCES events(id),\n   \
  \ player_name VARCHAR(255),\n    finish_position VARCHAR(50),\n    archetype VARCHAR(100),\n\
  \    archetype_tags VARCHAR(50)[],\n    main_deck JSONB NOT NULL, -- [{card_name,\
  \ quantity}]\n    sideboard JSONB NOT NULL,\n    created_at TIMESTAMP DEFAULT NOW()\n\
  );\n\nCREATE INDEX idx_decklists_archetype ON decklists(archetype);\nCREATE INDEX\
  \ idx_decklists_event ON decklists(event_id);\n```\n\n### Meta Snapshots Table\n\
  \n```sql\nCREATE TABLE meta_snapshots (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n\
  \    format VARCHAR(50) NOT NULL,\n    snapshot_date DATE NOT NULL,\n    archetype\
  \ VARCHAR(100) NOT NULL,\n    meta_percentage DECIMAL(5,2),\n    sample_size INTEGER,\n\
  \    avg_finish DECIMAL(4,2),\n    key_cards VARCHAR(255)[],\n    created_at TIMESTAMP\
  \ DEFAULT NOW(),\n    UNIQUE(format, snapshot_date, archetype)\n);\n\nCREATE INDEX\
  \ idx_meta_format_date ON meta_snapshots(format, snapshot_date DESC);\n```\n\n###\
  \ Card Co-occurrence Table\n\n```sql\nCREATE TABLE card_cooccurrence (\n    card_a\
  \ VARCHAR(255) NOT NULL,\n    card_b VARCHAR(255) NOT NULL,\n    cooccurrence_count\
  \ INTEGER NOT NULL,\n    format VARCHAR(50) NOT NULL,\n    last_updated DATE NOT\
  \ NULL,\n    PRIMARY KEY (card_a, card_b, format)\n);\n\nCREATE INDEX idx_cooccurrence_card\
  \ ON card_cooccurrence(card_a, format);\n```\n\n### Conversations Table\n\n```sql\n\
  CREATE TABLE conversations (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n\
  \    current_deck JSONB,\n    messages JSONB[], -- Array of {role, content, timestamp}\n\
  \    created_at TIMESTAMP DEFAULT NOW(),\n    updated_at TIMESTAMP DEFAULT NOW()\n\
  );\n```\n\n---\n\n## Success Metrics\n\n### Core Metrics\n\n1. **Card validity rate**:\
  \ % of generated cards that exist and are format-legal\n   - Target: 100% (hard\
  \ requirement)\n\n2. **Deck validity rate**: % of generated decks that pass validation\
  \ (60+15, 4-of rule)\n   - Target: 100% (hard requirement)\n\n3. **Meta alignment**:\
  \ How closely generated decks match tournament archetypes\n   - Measured by card\
  \ overlap with reference decks\n\n4. **User satisfaction**: Qualitative feedback\
  \ on deck quality and explanations\n\n### Technical Metrics\n\n1. **Response time**:\
  \ Time from user message to complete deck generation\n   - Target: <30 seconds for\
  \ full deck\n\n2. **Card search latency**: Time for semantic card search\n   - Target:\
  \ <500ms\n\n3. **Data freshness**: Time since last Scryfall/mtgtop8 sync\n   - Target:\
  \ Cards <24 hours, Meta <7 days"
epics:
- id: 37e1856b-EP-2
  title: Core Deck Builder Engine
  description: "Implements the AI-driven deck generation workflow: interpreting user\
    \ intent, querying meta data, orchestrating slot-by-slot card selection, sideboard\
    \ construction, deck iteration, and providing detailed explanations and matchup\
    \ analysis. Enforces all deck validation rules (size, copy limits, legality)."
  priority: 1
- id: 37e1856b-EP-5
  title: Chat Interface & Conversation Experience
  description: Develops the React chat UI, conversation-memory backend, and related
    API endpoints (chat, card search, deck import/export). Enables real-time interaction,
    hoverable card details, deck export buttons, and persistent conversation state
    per user.
  priority: 1
- id: 37e1856b-EP-4
  title: Meta Data Management & Analytics
  description: Collects tournament results from mtgtop8, classifies archetypes, computes
    meta percentages, average finishes, and card co-occurrence statistics. Supplies
    this data to the deck builder for meta-aware recommendations and matchup guidance.
  priority: 2
- id: 37e1856b-EP-3
  title: Card Catalog & Anti-Hallucination Validation
  description: Provides a searchable, up-to-date card database sourced from Scryfall,
    including embeddings for semantic search. Enforces constraints (color, CMC, type,
    legality) and returns candidate sets to the LLM. Performs final validation of
    card existence, Standard legality, and copy limits before adding to a deck.
  priority: 2
- id: 37e1856b-EP-6
  title: Deck Import, Export & Sharing
  description: Parses multiple decklist formats (Arena, MTGO, simple text), validates
    each entry, flags issues, and provides export options (Arena format, MTGO .txt,
    shareable link). Supports auto-correction suggestions for misspelled or illegal
    cards.
  priority: 3
- id: 37e1856b-EP-7
  title: Operations, Data Sync & Monitoring
  description: Implements scheduled jobs for daily Scryfall sync and weekly mtgtop8
    scraping, including error handling, retries, and alerting. Provides health checks,
    logging, and dashboards for data freshness and job success rates.
  priority: 3
- id: 37e1856b-EP-1
  title: User Management & Account Services
  description: Handles user registration, authentication, profile management, and
    persistence of user-specific data such as saved decks, conversation history, and
    preferences. Provides secure access controls for private decks and optional sharing
    features.
  priority: 4
stories:
- id: 37e1856b-EP-1-US-1
  epic_id: 37e1856b-EP-1
  actor: New player
  action: register an account using email and password
  benefit: gain a personalized space to store decks and conversation history, enabling
    a continuous and tailored experience
  acceptance_criteria:
  - User can navigate to a registration page from the home screen
  - Form requires a valid email address, a password meeting complexity rules, and
    password confirmation
  - Submitting valid data creates a new user record and sends a verification email
  - User receives a verification email with a functional link that activates the account
  - Attempting to register with an already-used email shows an appropriate error message
  priority: must_have
  status: ready
- id: 37e1856b-EP-1-US-2
  epic_id: 37e1856b-EP-1
  actor: Returning player
  action: log in with email and password
  benefit: access personal decks, preferences, and conversation history securely
  acceptance_criteria:
  - Login page accepts email and password fields
  - Valid credentials authenticate the user and create a session token
  - After login, the user is redirected to their dashboard showing saved decks
  - Invalid credentials display a clear error without revealing which field is incorrect
  - Session expires after a configurable period of inactivity
  priority: must_have
  status: ready
- id: 37e1856b-EP-1-US-3
  epic_id: 37e1856b-EP-1
  actor: Registered user
  action: reset a forgotten password
  benefit: restore access to the account without needing support intervention
  acceptance_criteria:
  - User can request a password reset from the login screen
  - System sends a time-limited reset link to the user's verified email address
  - Reset link leads to a page where the user can set a new password meeting complexity
    rules
  - After successful reset, the user can log in with the new password
  - Expired or used reset links show an appropriate error
  priority: must_have
  status: ready
- id: 37e1856b-EP-1-US-4
  epic_id: 37e1856b-EP-1
  actor: Authenticated user
  action: view and edit their profile information (display name, avatar, and contact
