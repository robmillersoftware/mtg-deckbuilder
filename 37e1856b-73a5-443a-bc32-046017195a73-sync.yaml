  title: "Build the end-to-end deck generation flow: parse the user’s natural-language\
    \ request, extract archetype, colors and strategic intent, invoke the LLM-driven\
    \ deck synthesis engine, enforce Standard legality and four-copy limits, produce\
    \ a 60-card main deck plus a 15-card sideboard, and attach a concise strategy\
