  - The system enforces the 4-copy limit for non-basic-land cards.
  - All cards are verified to be Standard-legal; banned cards are identified.
  - A summary of validation results is presented, listing any violations with clear
    messages.
  - If the deck passes validation, a green “Deck is valid” indicator is shown.
  priority: must_have
  status: ready
- id: 37e1856b-EP-6-US-50
  epic_id: 37e1856b-EP-6
  actor: Competitive player
  action: receive auto-correction suggestions for misspelled or illegal cards during
    import
  benefit: so I can quickly fix errors without leaving the interface
  acceptance_criteria:
  - When a card name cannot be matched, the system performs a fuzzy search and presents
    up to three likely intended cards.
  - When a matched card is not Standard-legal, the system suggests up to three legal
    alternatives with similar mana cost, type, or role.
  - The user can accept a suggestion with a single click, which replaces the problematic
    entry.
  - After applying suggestions, the deck is re-validated automatically.
  priority: should_have
  status: ready
- id: 37e1856b-EP-6-US-51
  epic_id: 37e1856b-EP-6
  actor: Competitive player
  action: export my current deck in Arena format
  benefit: so I can copy the text directly into the Arena client to play the deck
  acceptance_criteria:
  - A "Copy to Arena" button is displayed after a valid deck is present.
  - Clicking the button copies a correctly formatted Arena decklist (including set
    codes and collector numbers) to the clipboard.
  - The exported text includes all 60 main-deck cards followed by sideboard cards,
