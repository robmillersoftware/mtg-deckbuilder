  priority: must_have
  status: ready
- id: 37e1856b-EP-5-US-43
  epic_id: 37e1856b-EP-5
  actor: Registered user
  action: have my conversation (including deck state) persisted across sessions
  benefit: return later and continue the same discussion without losing progress
  acceptance_criteria:
  - When a user is authenticated, each conversation is stored in the Conversations
