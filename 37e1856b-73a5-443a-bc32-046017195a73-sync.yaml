  acceptance_criteria:
  - Given a set of filter parameters, the system returns a list of cards where each
    card matches all supplied filters
  - All returned cards have `legalities.standard = "legal"`
  - The response includes card name, mana cost, type line, oracle text, and image
    URL
  - The search completes within 500 ms for typical filter combinations
  priority: must_have
  status: ready
- id: 37e1856b-EP-3-US-21
  epic_id: 37e1856b-EP-3
  actor: Competitive player
  action: perform a semantic search by describing a desired card in natural language
  benefit: allows users to find appropriate cards without knowing exact names or technical
