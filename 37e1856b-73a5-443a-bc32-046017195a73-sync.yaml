  - Clicking a deck loads its full details (main deck, sideboard, notes) in the deck
    view screen
  - List updates in real time when decks are added, edited, or deleted
  - If no decks exist, a friendly message encourages the user to generate a deck
  priority: must_have
  status: ready
- id: 37e1856b-EP-1-US-7
  epic_id: 37e1856b-EP-1
  actor: Authenticated user
  action: delete a saved deck
  benefit: remove outdated or unwanted decks, keeping the account organized
  acceptance_criteria:
  - User can select a deck from the 'My Decks' list and click a 'Delete' action
  - System asks for confirmation before permanently removing the deck
  - After deletion, the deck no longer appears in the list and is removed from the
