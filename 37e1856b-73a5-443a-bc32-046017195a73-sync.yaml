  - '  - error type (e.g., "card_not_found" or "not_standard_legal"),'
  - '  - the attempted card name,'
  - '  - a list of up to three suggested alternatives (with card IDs and names),'
  - '  - an instruction for the user (e.g., "Select a suggested card or describe a
